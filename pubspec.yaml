name: watchmark
description: "A local-first movie and series tracking application for Android and Desktop."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  window_manager: ^0.3.9
  uuid: ^4.5.1
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  intl: ^0.19.0
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.5
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  googleapis_auth: ^2.3.3
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  connectivity_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  drift_dev: ^2.34.0
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"
  linux:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
